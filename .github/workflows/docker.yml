name: Docker

on:
  workflow_dispatch:
  push:
    # 在main分支有新的提交时触发；只监听会影响同步结果的文件
    branches: [ main ]
    paths:
      - images.yaml
      - .github/workflows/docker.yml
      - scripts/**


env:
  ALIYUN_REGISTRY: "${{ secrets.ALIYUN_REGISTRY }}"
  ALIYUN_NAME_SPACE: "${{ secrets.ALIYUN_NAME_SPACE }}"
  ALIYUN_REGISTRY_USER: "${{ secrets.ALIYUN_REGISTRY_USER }}"
  ALIYUN_REGISTRY_PASSWORD: "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}"

jobs:
  build:
    name: Pull
    runs-on: ubuntu-latest
    steps:
    - name: Before freeing up disk space
      run: |
        echo "Before freeing up disk space"
        echo "=============================================================================="
        df -hT
        echo "=============================================================================="

    # 增加可用磁盘空间
    # 钉在 commit SHA：easimon/maximize-build-space master 分支会随上游漂移，供应链不可控
    - name: Maximize build space
      uses: easimon/maximize-build-space@c28619d8999a147d5e09c1199f84ff6af6ad5794
      with:

        root-reserve-mb: 2048
        swap-size-mb: 128
        remove-dotnet: 'true'
        remove-haskell: 'true'
        # 如果空间还是不够用，可以把以下开启，清理出更多空间
        # remove-android: 'true'
        # remove-codeql: 'true'
        build-mount-path: '/var/lib/docker/'

    - name: Restart docker
      run: sudo service docker restart

    - name: Free up disk space complete
      run: |
        echo "Free up disk space complete"
        echo "=============================================================================="
        df -hT
        echo "=============================================================================="

    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Docker Setup Buildx
      uses: docker/setup-buildx-action@v3

    - name: Install jq
      run: sudo apt-get update && sudo apt-get install -y jq

    # 用隔离 venv 提供 PyYAML，避免污染系统 Python；版本钉死保证解析行为稳定
    - name: Setup PyYAML venv
      run: |
        python3 -m venv .venv
        .venv/bin/pip install --disable-pip-version-check PyYAML==6.0.3

    # 清单解析失败会在登陆阿里云之前退出，不会触发任何 login / pull
    - name: Sync images to Aliyun
      env:
        PYTHON: "${{ github.workspace }}/.venv/bin/python"
      run: bash scripts/sync-images.sh images.yaml
