# 镜像同步清单：Action 与 30 机拉取脚本共用的唯一来源（SSOT）。
#
# 字段：
#   source   必填，上游镜像；缺省 tag 视为 latest。
#   platform 可选，架构字符串列表，如 [linux/arm64]、[linux/arm64, linux/arm/v7]；
#            省略表示按 amd64 处理且阿里云 tag 不带架构后缀；列表逐项展开成多条，
#            单架构也写成单元素列表，同一 source 多架构合并到一条列表。
#   local    可选，拉取后额外打的本地 tag；省略表示只保留 source 名字。
#
# 引用支持 1/2/3 段：name、namespace/name、registry/namespace/name；
# 四段及以上路径（如 quay.io/minio/aistor/minio）不支持，加载时会明确报错。
#
# 条目示例：
#   - source: oven/bun:1.2.19-alpine
#   - source: continuumio/miniconda3:24.9.2-0
#     platform: [linux/arm64]
#   - source: xiaoyaliu/alist
#     platform: [linux/arm64, linux/arm/v7]
#   - source: alpine/minio:RELEASE.2025-10-15T17-29-55Z
#     local: minio/minio:latest
images:
  # 开发相关
  - source: alpine
  - source: alpine:3.21
  - source: oven/bun:1.2.19-alpine
  - source: mysql:5.7.44
  - source: postgres:15.7-alpine
  - source: postgres:18-alpine
  - source: postgres:18.6
  # postgres 的 vector 插件
  - source: pgvector/pgvector:pg17
  - source: python:alpine3.19
  - source: continuumio/miniconda3:24.9.2-0
    platform: [linux/arm64]
  - source: python:3.9.23-slim-bullseye
    platform: [linux/arm/v7]
  - source: python:3.11-slim-bookworm
    platform: [linux/arm/v7]
  - source: nginx:1.25.5

  # node.js
  - source: node:22-alpine
  # go
  - source: golang:1.26-alpine
  # php
  - source: php:7.4-fpm
  # java
  - source: eclipse-temurin:21-jre

  # 工具 alist
  - source: xhofe/alist:v3.35.0
  - source: xhofe/alist:latest
  - source: xiaoyaliu/alist
    platform: [linux/arm64, linux/arm/v7]

  # 工具 aria2-pro
  - source: p3terx/aria2-pro
  - source: p3terx/ariang

  # 工具 docker 管理
  - source: portainer/portainer-ce:2.39.0

  # 项目管理 开源软件 plane
  - source: makeplane/plane-frontend:v1.2.3
  - source: makeplane/plane-space:v1.2.3
  - source: makeplane/plane-admin:v1.2.3
  - source: makeplane/plane-live:v1.2.3
  - source: makeplane/plane-backend:v1.2.3
  - source: makeplane/plane-proxy:v1.2.3

  - source: makeplane/plane-frontend:v1.3.0
  - source: makeplane/plane-space:v1.3.0
  - source: makeplane/plane-admin:v1.3.0
  - source: makeplane/plane-live:v1.3.0
  - source: makeplane/plane-backend:v1.3.0
  - source: makeplane/plane-proxy:v1.3.0

  - source: valkey/valkey:7.2.11-alpine
  - source: rabbitmq:3.13.6-management-alpine
  - source: alpine/minio:RELEASE.2025-10-15T17-29-55Z
    local: minio/minio:latest

  # 通过 channel 聊天解决问题, 看板
  - source: mattermost/mattermost-team-edition:release-11.6
